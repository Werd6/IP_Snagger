<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotcha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }
        
        h1 {
            font-size: 48px;
            color: #000000;
        }
    </style>
</head>
<body>
    <h1>Gotcha</h1>
    
    <script>
        // Capture IP address when page loads
        fetch('/api/capture-ip')
            .then(response => response.json())
            .then(data => {
                console.log('IP captured:', data.ip);
            })
            .catch(error => {
                console.error('Error capturing IP:', error);
            });
    </script>
</body>
</html>
